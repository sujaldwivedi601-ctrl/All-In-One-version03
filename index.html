    <script>
      // Suppress noisy Vite HMR WebSocket connection messages in AI Studio iframe preview
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && (
          String(event.reason).includes('WebSocket closed') ||
          String(event.reason.message || '').includes('WebSocket closed') ||
          String(event.reason).includes('failed to connect to websocket')
        )) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        if (event && event.message && (
          event.message.includes('WebSocket') ||
          event.message.includes('[vite] failed to connect')
        )) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });

      // Immediately purge all service worker caches and unregister service workers
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var i = 0; i < names.length; i++) {
            caches.delete(names[i]);
          }
        });
      }
    </script>
  </head>
  <body class="bg-[#F8FAF6] text-slate-800 antialiased font-['Plus_Jakarta_Sans',sans-serif]">
